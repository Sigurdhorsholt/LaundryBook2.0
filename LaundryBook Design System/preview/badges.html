<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:Inter,sans-serif}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.b{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;padding:3px 10px;border-radius:999px}
.h{font-size:10.5px;color:#5a6a7a;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:6px;width:100%}
.dot{width:6px;height:6px;border-radius:50%}
</style></head><body>
<div class="row"><div class="h">Role badges</div>
<span class="b" style="background:#f0f4f8;color:#5a6a7a">Beboer</span>
<span class="b" style="background:#e8f5ee;color:#3d7a5c">Ejendomsadmin</span>
<span class="b" style="background:#e8f5e9;color:#2e7d32">Organisationsadmin</span>
<span class="b" style="background:#fce4ec;color:#c62828">Systemadmin</span>
</div>
<div class="row"><div class="h">Status pills</div>
<span class="b" style="background:#f0fdf4;color:#2e7d32"><span class="dot" style="background:#2e7d32"></span>Aktiv</span>
<span class="b" style="background:#fff8e1;color:#b45309">Afventer</span>
<span class="b" style="background:#fce4ec;color:#c62828">Aflyst</span>
</div>
<div class="row"><div class="h">Dots (availability)</div>
<span style="display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:#5a6a7a"><span class="dot" style="background:#4caf50"></span>Ledig</span>
<span style="display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:#5a6a7a"><span class="dot" style="background:#f59e0b"></span>Få tilbage</span>
<span style="display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:#5a6a7a"><span class="dot" style="background:#e0e0e0"></span>Fuldt booket</span>
</div>
</body></html>
