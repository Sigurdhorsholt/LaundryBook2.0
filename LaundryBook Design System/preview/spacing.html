<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:Inter,sans-serif}
.row{display:flex;align-items:center;gap:12px;margin-bottom:6px;font-size:11px;color:#5a6a7a;font-variant-numeric:tabular-nums}
.label{width:64px;color:#1a2e24;font-weight:600}
.bar{background:#3d7a5c;height:14px;border-radius:3px}
</style></head><body>
<div class="row"><div class="label">--space-1</div><div class="bar" style="width:4px"></div>4px · inline gap</div>
<div class="row"><div class="label">--space-2</div><div class="bar" style="width:8px"></div>8px · pill padding Y</div>
<div class="row"><div class="label">--space-3</div><div class="bar" style="width:12px"></div>12px · card padding .p-3</div>
<div class="row"><div class="label">--space-4</div><div class="bar" style="width:16px"></div>16px · card padding .p-4</div>
<div class="row"><div class="label">--space-5</div><div class="bar" style="width:24px"></div>24px · page padding mobile</div>
<div class="row"><div class="label">--space-6</div><div class="bar" style="width:32px"></div>32px · section spacing</div>
<div class="row"><div class="label">--space-7</div><div class="bar" style="width:48px"></div>48px · EmptyState padding Y</div>
<div class="row"><div class="label">--space-8</div><div class="bar" style="width:64px"></div>64px · hero breathing room</div>
</body></html>
