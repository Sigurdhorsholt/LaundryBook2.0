<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Upcoming Booking</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:Inter,sans-serif;color:#1a2e24}
.card{background:#f0fdf4;border:1px solid #c8e6c9;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.eye{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#2e7d32}
.line{font-size:.9rem;font-weight:600;margin-top:4px;color:#1a2e24}
.btn{margin-left:auto;border:1px solid #c62828;color:#c62828;background:#fff;border-radius:7px;padding:5px 14px;font-size:.78rem;font-weight:500;cursor:pointer}
</style></head><body>
<div class="card">
  <div>
    <div class="eye">Din næste booking</div>
    <div class="line">Onsdag 17. april  ·  10:00 – 11:30  ·  Vaskerum 1</div>
  </div>
  <button class="btn">Aflys</button>
</div>
</body></html>
