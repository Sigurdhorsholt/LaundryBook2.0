<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{border:1px solid var(--color-border);border-radius:8px;overflow:hidden}
.chip{height:56px}
.meta{padding:8px 10px;font:500 11px/1.3 Inter,sans-serif;color:var(--color-text-primary)}
.hex{color:var(--color-text-muted);font-weight:400;font-size:10.5px;margin-top:2px;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#3d7a5c"></div><div class="meta">primary<div class="hex">#3d7a5c</div></div></div>
  <div class="sw"><div class="chip" style="background:#336650"></div><div class="meta">primaryAccent<div class="hex">#336650</div></div></div>
  <div class="sw"><div class="chip" style="background:#2a5c42"></div><div class="meta">primaryMutedText<div class="hex">#2a5c42</div></div></div>
  <div class="sw"><div class="chip" style="background:#b8ddc9"></div><div class="meta">primaryBorder<div class="hex">#b8ddc9</div></div></div>
  <div class="sw"><div class="chip" style="background:#d0ecdb"></div><div class="meta">primaryMuted<div class="hex">#d0ecdb</div></div></div>
  <div class="sw"><div class="chip" style="background:#e8f5ee"></div><div class="meta">primaryLight<div class="hex">#e8f5ee</div></div></div>
  <div class="sw"><div class="chip" style="background:#f2faf5"></div><div class="meta">primaryLighter<div class="hex">#f2faf5</div></div></div>
  <div class="sw"><div class="chip" style="background:#1a2e24"></div><div class="meta">textPrimary<div class="hex">#1a2e24</div></div></div>
</div>
</body></html>
