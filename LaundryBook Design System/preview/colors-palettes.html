<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Palettes</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:Inter,sans-serif}
.pal{margin-bottom:14px}
.pal h4{margin:0 0 6px;font-size:11px;font-weight:600;color:#5a6a7a;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:6px}
.chip{flex:1;height:40px;border-radius:6px;border:1px solid #e8ecf0;display:flex;align-items:flex-end;padding:4px 6px;font-size:9.5px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.chip.lt{color:#1a2e24;font-weight:500}
.active{border:2px solid #3d7a5c;border-radius:8px;padding:6px 8px 8px}
.activeLabel{display:inline-block;background:#3d7a5c;color:#fff;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:999px;margin-left:6px;text-transform:uppercase;letter-spacing:.05em}
</style></head><body>
<div class="pal active"><h4>Warm Sage <span class="activeLabel">Active</span></h4>
<div class="row">
<div class="chip" style="background:#3d7a5c">#3d7a5c</div>
<div class="chip" style="background:#336650">#336650</div>
<div class="chip lt" style="background:#d0ecdb">#d0ecdb</div>
<div class="chip lt" style="background:#e8f5ee">#e8f5ee</div>
</div></div>
<div class="pal"><h4>Blue — Original</h4>
<div class="row">
<div class="chip" style="background:#1565c0">#1565c0</div>
<div class="chip" style="background:#0d3b7a">#0d3b7a</div>
<div class="chip lt" style="background:#dce8ff">#dce8ff</div>
<div class="chip lt" style="background:#e8f0fe">#e8f0fe</div>
</div></div>
<div class="pal"><h4>Fresh Teal</h4>
<div class="row">
<div class="chip" style="background:#0f7ea6">#0f7ea6</div>
<div class="chip" style="background:#1a6e8a">#1a6e8a</div>
<div class="chip lt" style="background:#d0eef8">#d0eef8</div>
<div class="chip lt" style="background:#e0f4fa">#e0f4fa</div>
</div></div>
</body></html>
