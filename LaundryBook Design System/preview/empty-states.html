<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Empty States</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:Inter,sans-serif;color:#1a2e24}
.empty{border:1.5px dashed #d0d8e0;border-radius:12px;padding:32px 20px;text-align:center;margin-bottom:14px}
.empty .t{font-weight:600;color:#5a6a7a;font-size:.95rem;margin:0}
.empty .d{color:#a0adb8;font-size:.85rem;margin:4px 0 0}
.banner{background:#fff8e1;border:1px solid #ffe0b2;color:#b45309;border-radius:8px;padding:10px 14px;font-size:.82rem;margin-bottom:10px}
</style></head><body>
<div class="banner">Du har nået din bookinggrænse. Aflys en aktiv booking for at frigøre en plads.</div>
<div class="empty">
  <p class="t">Ingen tidspladser konfigureret</p>
  <p class="d">Administratoren har endnu ikke oprettet tidspladser for dette vaskerum.</p>
</div>
</body></html>
