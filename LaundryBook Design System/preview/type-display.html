<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:Inter,sans-serif;color:#1a2e24}
.row{padding:6px 0;display:grid;grid-template-columns:100px 1fr;gap:14px;align-items:baseline}
.row + .row{border-top:1px solid #f0f4f8}
.meta{font-size:10.5px;color:#a0adb8;font-variant-numeric:tabular-nums;line-height:1.4}
.meta b{color:#5a6a7a;display:block;font-weight:600;margin-bottom:1px}
</style></head><body>
<div class="row"><div class="meta"><b>Hero</b>clamp 2–3.5rem / 700 / -0.5px</div>
  <div style="font-weight:700;font-size:2.6rem;line-height:1.15;letter-spacing:-0.5px">Simpel digital booking</div></div>
<div class="row"><div class="meta"><b>Section H2</b>clamp 1.5–2.2rem / 700 / -0.3px</div>
  <div style="font-weight:700;font-size:1.8rem;letter-spacing:-0.3px">Alt hvad din forening har brug for</div></div>
<div class="row"><div class="meta"><b>Display H1</b>2rem / 700</div>
  <div style="font-weight:700;font-size:2rem;line-height:1.1">Oversigt</div></div>
<div class="row"><div class="meta"><b>Page H1</b>1.6rem / 700</div>
  <div style="font-weight:700;font-size:1.6rem">Brugere</div></div>
<div class="row"><div class="meta"><b>Card H3</b>1.15rem / 700</div>
  <div style="font-weight:700;font-size:1.15rem">Din næste booking</div></div>
</body></html>
