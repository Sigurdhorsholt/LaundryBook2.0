<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#f8fafb;font-family:Inter,sans-serif;color:#1a2e24}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border:1px solid #e8ecf0;border-radius:12px;padding:16px}
.card.hover{box-shadow:0 4px 16px rgba(13,59,122,.09);transform:translateY(-1px)}
.stat p{margin:0}
.stat .l{font-size:.85rem;color:#5a6a7a;font-weight:500}
.stat .v{font-size:2rem;font-weight:700;line-height:1.1;margin-top:2px}
.stat .s{font-size:.8rem;color:#a0adb8;margin-top:2px}
.prop{display:flex;align-items:center;gap:12px}
.prop .icon{width:40px;height:40px;border-radius:7px;background:#e8f5ee;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prop .t{font-size:.9rem;font-weight:600;margin:0}
.prop .sub{font-size:.78rem;color:#5a6a7a;margin:2px 0 0}
.prop .chev{margin-left:auto;color:#a0adb8}
</style></head><body>
<div class="grid">
<div class="card stat"><p class="l">Aktive bookinger</p><p class="v">12</p><p class="s">i dag</p></div>
<div class="card hover prop">
  <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3d7a5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
  <div><p class="t">Nørrebrogade 42</p><p class="sub">Ejendomsadmin · Lejl. 3.tv</p></div>
  <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
</div>
</div>
</body></html>
