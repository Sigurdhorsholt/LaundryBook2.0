<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:Inter,sans-serif}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{border:1px solid #e8ecf0;border-radius:8px;overflow:hidden}
.chip{height:44px}
.meta{padding:6px 8px;font-size:11px;font-weight:500;color:#1a2e24}
.hex{font-size:10px;color:#8a9aaa;margin-top:1px;font-variant-numeric:tabular-nums}
h4{font-size:11px;color:#5a6a7a;margin:14px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
h4:first-child{margin-top:0}
</style></head><body>
<h4>Surfaces & Borders</h4>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#f8fafb"></div><div class="meta">bgPage<div class="hex">#f8fafb</div></div></div>
  <div class="sw"><div class="chip" style="background:#ffffff;border-bottom:1px solid #e8ecf0"></div><div class="meta">bgCard<div class="hex">#ffffff</div></div></div>
  <div class="sw"><div class="chip" style="background:#f0f4f8"></div><div class="meta">bgSubtle<div class="hex">#f0f4f8</div></div></div>
  <div class="sw"><div class="chip" style="background:#f4f6f8"></div><div class="meta">bgMuted<div class="hex">#f4f6f8</div></div></div>
  <div class="sw"><div class="chip" style="background:#e8ecf0"></div><div class="meta">borderDefault<div class="hex">#e8ecf0</div></div></div>
  <div class="sw"><div class="chip" style="background:#d0d8e0"></div><div class="meta">borderStrong<div class="hex">#d0d8e0</div></div></div>
  <div class="sw"><div class="chip" style="background:#f0f4f8"></div><div class="meta">borderRow<div class="hex">#f0f4f8</div></div></div>
  <div class="sw"><div class="chip" style="background:#f8fafc"></div><div class="meta">bgHeader<div class="hex">#f8fafc</div></div></div>
</div>
<h4>Text</h4>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#1a2e24"></div><div class="meta">textPrimary<div class="hex">#1a2e24</div></div></div>
  <div class="sw"><div class="chip" style="background:#5a6a7a"></div><div class="meta">textSecondary<div class="hex">#5a6a7a</div></div></div>
  <div class="sw"><div class="chip" style="background:#a0adb8"></div><div class="meta">textMuted<div class="hex">#a0adb8</div></div></div>
  <div class="sw"><div class="chip" style="background:#c0ccd8"></div><div class="meta">textDisabled<div class="hex">#c0ccd8</div></div></div>
</div>
</body></html>
